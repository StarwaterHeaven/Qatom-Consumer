name = "qatom-storefront"
main = "src/index.js"
compatibility_date = "2026-08-01"

# Same Cloudflare account/zone as the other agentkepler.tech subdomains.
routes = [{ pattern = "try.agentkepler.tech", custom_domain = true }]

rules = [{ type = "Text", globs = ["**/*.txt"], fallthrough = true }]

[vars]
SITE_URL = "https://try.agentkepler.tech"
MIN_GUEST_PRICE = "0.5"      # Stripe card minimum (USD) per checkout; smaller items go through a cart
HIDDEN_IDS = "20,180,215"    # test items kept out of the storefront
FEATURED_ID = "24"           # Harcourt NAV, $1

# Qatom sign-in. Qatom rotates refresh tokens and revokes the sign-in if an old one is
# reused, so one Durable Object holds the token and refreshes it one request at a time.
[[durable_objects.bindings]]
name = "TOKEN_MANAGER"
class_name = "TokenManager"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TokenManager"]

# 20 checkout links per minute per IP
[[ratelimits]]
name = "BUY_LIMITER"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 20
  period = 60

[observability]
enabled = true

# Secrets (never in this file):
#   QATOM_CLIENT_ID, QATOM_REFRESH_TOKEN   from: node scripts/get-token.mjs
#   QATOM_MCP_TOKEN                        optional static fallback
